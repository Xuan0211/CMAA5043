<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header id="main-header">
        <h1>Contact Me</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Get in Touch</h2>
        <p>Feel free to reach out to me for collaboration or inquiries.</p>

        <form class="contact-form" action="#" method="post">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Your full name">
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
            </div>

            <div class="form-group">
                <label for="question">Contact Questions:</label>
                <textarea id="question" name="question" rows="5" required placeholder="How can I help you?"></textarea>
            </div>

            <button type="submit">Submit Request</button>
        </form>
    </main>

    <footer id="main-footer">
        <p>&copy; 2026 My Portfolio. All rights reserved. Created with the help of Antigravity AI.</p>
    </footer>

</body>

</html>
